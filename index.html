<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kuis Benar atau Salah</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            padding: 40px 35px;
            max-width: 700px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #2c3e50; margin-bottom: 25px; font-size: 2rem; line-height: 1.3; }

        /* === FORM IDENTITAS === */
        .form-identitas {
            background: #f0f8ff;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: left;
            border: 2px solid #4facfe;
        }
        .form-identitas h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            text-align: center;
            font-size: 1.2rem;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #0c5460;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #b8d8e8;
            border-radius: 10px;
            font-size: 1rem;
            transition: border 0.2s;
            outline: none;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.15);
        }

        .pengaturan {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        .pengaturan label {
            font-weight: 600;
            color: #0c5460;
            margin-right: 8px;
        }
        .pengaturan input[type="number"] {
            width: 70px;
            padding: 8px;
            border: 1px solid #0097b8;
            border-radius: 8px;
            font-size: 1rem;
            text-align: center;
        }
        .pengaturan button {
            background: #0097b8;
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 8px;
            margin-left: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .pengaturan button:hover { background: #007a94; }
        .tombol-mulai {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            padding: 20px 60px;
            border-radius: 16px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            margin: 20px 0;
            transition: transform 0.2s;
        }
        .tombol-mulai:hover { transform: scale(1.05); }
        .timer {
            background: #fff3cd;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #856404;
            font-size: 1.3rem;
            display: none;
        }
        .progress { margin-bottom: 15px; color: #7f8c8d; font-size: 1.1rem; display: none; }
        .soal-box {
            background: #f8f9fa;
            padding: 35px 25px;
            border-radius: 18px;
            margin-bottom: 20px;
            border-left: 6px solid #4facfe;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            line-height: 1.7;
            color: #2c3e50;
            display: none;
        }
        .tombol-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            display: none;
        }
        .tombol {
            flex: 1;
            padding: 22px 15px;
            border: none;
            border-radius: 16px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .tombol:hover { transform: scale(1.05); }
        .tombol-benar { background: #2ecc71; color: white; }
        .tombol-salah { background: #e74c3c; color: white; }
        .tombol:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .lanjut-btn {
            background: #3498db;
            color: white;
            padding: 16px 35px;
            border: none;
            border-radius: 14px;
            font-size: 1.2rem;
            cursor: pointer;
            display: none;
            margin: 10px auto;
        }
        .lanjut-btn:hover { background: #2980b9; }
        .akhir, .pembahasan { display: none; }
        .daftar-soal { text-align: left; margin-top: 20px; max-height: 400px; overflow-y: auto; }
        .item-soal { padding: 15px; border-bottom: 1px solid #eee; }
        .label-benar { color: #2ecc71; font-weight: bold; }
        .label-salah { color: #e74c3c; font-weight: bold; }
        .label-netral { color: #3498db; font-weight: bold; }

        .info-siswa {
            background: #d4edda;
            color: #155724;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
            font-size: 0.95rem;
        }
        .status-kirim {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 Benar atau Salah?<br>Materi Informatika</h1>

        <!-- === FORM IDENTITAS SISWA === -->
        <div class="form-identitas" id="form-identitas">
            <h3>👤 Isi Data Diri Dulu Ya</h3>
            <div class="form-group">
                <label for="input-nama">Nama Lengkap</label>
                <input type="text" id="input-nama" placeholder="Contoh: Budi Santoso" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="input-kelas">Kelas</label>
                <input type="text" id="input-kelas" placeholder="Contoh: XI IPA 1" autocomplete="off">
            </div>
        </div>

        <div class="pengaturan" id="pengaturan">
            <label>⏱️ Waktu per soal (detik):</label>
            <input type="number" id="input-waktu" value="20" min="5" max="120">
            <button onclick="terapkanWaktu()">Terapkan</button>
        </div>

        <button class="tombol-mulai" id="tombol-mulai" onclick="mulaiKuis()">▶️ MULAI</button>

        <div class="info-siswa" id="info-siswa"></div>

        <div class="progress" id="progress">Soal 1 dari 0</div>
        <div class="timer" id="timer">⏱️ Waktu: 20 detik</div>

        <div id="layar-soal">
            <div class="soal-box" id="teks-soal"></div>
            <div class="tombol-group" id="tombol-jawaban">
                <button class="tombol tombol-benar" onclick="cekJawaban(true)">✅ BENAR</button>
                <button class="tombol tombol-salah" onclick="cekJawaban(false)">❌ SALAH</button>
            </div>
            <button class="lanjut-btn" id="tombol-lanjut" onclick="soalBerikutnya()">Soal Berikutnya →</button>
        </div>

        <div class="akhir" id="layar-akhir">
            <h2 style="font-size: 1.8rem; margin-bottom: 25px;">🎉 Permainan Selesai!</h2>
            <p style="margin: 20px 0; font-size: 1.1rem; color: #555;">
                Jawabanmu sudah tersimpan. Terima kasih sudah mengerjakan! 🙌
            </p>
            <div class="status-kirim" id="status-kirim"></div>
            <button class="lanjut-btn" style="display:inline-block;" onclick="tampilkanPembahasan()">📖 Lihat Semua Jawaban</button>
            <button class="lanjut-btn" style="background:#2ecc71; display:inline-block;" onclick="mulaiUlang()">🔄 Mulai Ulang</button>
        </div>

        <div class="pembahasan" id="layar-pembahasan">
            <h2 style="font-size: 1.8rem; margin-bottom: 20px;">📖 Pembahasan Lengkap</h2>
            <div class="daftar-soal" id="daftar-pembahasan"></div>
            <button class="lanjut-btn" style="margin-top:25px;" onclick="mulaiUlang()">🔄 Mulai Ulang</button>
        </div>
    </div>

<script>
/* =========================================================
   ⚙️ KONFIGURASI GOOGLE SHEETS
   Ganti URL di bawah dengan URL Web App dari Google Apps Script
   ========================================================= */
const URL_GOOGLE_SHEETS = "https://script.google.com/macros/s/AKfycbxHumfJu2Agl0Sk65WZNXFtgcXPmYXgAw4OcqyA8IM7NjNUkNc2DZfC2IbaJIHVmwgS5g/exec";

let daftarSoal = [];
let nomor = 0, sudahDijawab = false;
let sisaWaktu = 20, waktuDefault = 20, timerInterval;
let riwayatJawaban = [];
let namaSiswa = "", kelasSiswa = "";

/* ---------- UTIL ---------- */
function terapkanWaktu() {
    const nilai = parseInt(document.getElementById("input-waktu").value);
    if (nilai >= 5 && nilai <= 120) {
        waktuDefault = nilai;
        sisaWaktu = waktuDefault;
        alert(`✅ Waktu diatur menjadi ${waktuDefault} detik per soal`);
    } else {
        alert("⚠️ Masukkan angka antara 5–120 detik");
    }
}

/* ---------- AMBIL SOAL ---------- */
async function ambilSoal() {
    try {
        const res = await fetch("soal.csv");
        if (!res.ok) throw new Error("Tidak ada file soal.csv");
        const teks = await res.text();
        const baris = teks.split("\n").map(r => {
            const hasil = [];
            let bagian = "", dalamKutip = false;
            for (let c of r) {
                if (c === '"') dalamKutip = !dalamKutip;
                else if (c === "," && !dalamKutip) { hasil.push(bagian.trim()); bagian = ""; }
                else bagian += c;
            }
            hasil.push(bagian.trim());
            return hasil;
        });

        daftarSoal = [];
        for (let i = 1; i < baris.length; i++) {
            const k = baris[i];
            if (!k || k.length < 3) continue;
            const teksSoal = k[0].replace(/^"|"$/g, "");
            const jawab = k[1].toUpperCase().replace(/^"|"$/g, "") === "BENAR";
            const jelas = k[2].replace(/^"|"$/g, "") || (jawab ? "✅ Benar!" : "❌ Salah!");
            if (teksSoal) daftarSoal.push({ teks: teksSoal, jawaban: jawab, penjelasan: jelas });
        }
    } catch {
        daftarSoal = [
            { teks: "CPU adalah otak dari komputer", jawaban: true, penjelasan: "✅ BENAR: CPU memproses semua perintah dan data." },
            { teks: "RAM menyimpan data permanen meski dimatikan", jawaban: false, penjelasan: "❌ SALAH: Data di RAM bersifat sementara dan hilang saat dimatikan." },
            { teks: "Algoritma adalah langkah logis untuk menyelesaikan masalah", jawaban: true, penjelasan: "✅ BENAR: Itulah definisi dasar algoritma." }
        ];
    }
}

/* ---------- VALIDASI & MULAI ---------- */
async function mulaiKuis() {
    const nama = document.getElementById("input-nama").value.trim();
    const kelas = document.getElementById("input-kelas").value.trim();

    if (!nama) {
        alert("⚠️ Nama tidak boleh kosong!");
        document.getElementById("input-nama").focus();
        return;
    }
    if (!kelas) {
        alert("⚠️ Kelas tidak boleh kosong!");
        document.getElementById("input-kelas").focus();
        return;
    }

    namaSiswa = nama;
    kelasSiswa = kelas;

    await ambilSoal();

    // Sembunyikan form & pengaturan
    document.getElementById("form-identitas").style.display = "none";
    document.getElementById("pengaturan").style.display = "none";
    document.getElementById("tombol-mulai").style.display = "none";

    // Tampilkan info siswa
    const info = document.getElementById("info-siswa");
    info.textContent = `👤 ${namaSiswa} — 🏫 ${kelasSiswa}`;
    info.style.display = "block";

    // Tampilkan elemen kuis
    document.getElementById("progress").style.display = "block";
    document.getElementById("timer").style.display = "block";
    document.getElementById("teks-soal").style.display = "flex";
    document.getElementById("tombol-jawaban").style.display = "flex";

    tampilSoal();
}

/* ---------- TAMPIL SOAL ---------- */
function tampilSoal() {
    sudahDijawab = false;
    sisaWaktu = waktuDefault;
    document.getElementById("progress").textContent = `Soal ${nomor + 1} dari ${daftarSoal.length}`;
    document.getElementById("teks-soal").textContent = daftarSoal[nomor].teks;
    document.getElementById("tombol-lanjut").style.display = "none";
    document.getElementById("tombol-jawaban").style.display = "flex";

    // Aktifkan kembali tombol
    document.querySelectorAll(".tombol").forEach(b => b.disabled = false);

    document.getElementById("timer").textContent = `⏱️ Waktu: ${sisaWaktu} detik`;
    mulaiHitungMundur();
}

function mulaiHitungMundur() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        sisaWaktu--;
        document.getElementById("timer").textContent = `⏱️ Waktu: ${sisaWaktu} detik`;
        if (sisaWaktu <= 0) {
            clearInterval(timerInterval);
            if (!sudahDijawab) {
                // Waktu habis → catat sebagai tidak dijawab
                simpanJawaban(nomor, null);
                lanjutOtomatis();
            }
        }
    }, 1000);
}

/* ---------- CEK JAWABAN (hanya untuk flow UI, tidak ada skor) ---------- */
function cekJawaban(pilihan) {
    if (sudahDijawab) return;
    sudahDijawab = true;
    clearInterval(timerInterval);

    // Nonaktifkan tombol
    document.querySelectorAll(".tombol").forEach(b => b.disabled = true);

    // Simpan jawaban ke riwayat & kirim ke Google Sheets
    simpanJawaban(nomor, pilihan);

    document.getElementById("tombol-jawaban").style.display = "none";

    if (nomor < daftarSoal.length - 1) {
        document.getElementById("tombol-lanjut").style.display = "block";
    } else {
        setTimeout(tampilHasil, 800);
    }
}

/* ---------- SIMPAN JAWABAN ---------- */
function simpanJawaban(indexSoal, pilihan) {
    // pilihan: true = BENAR, false = SALAH, null = tidak dijawab (waktu habis)
    let jawabanTeks = "TIDAK DIJAWAB";
    if (pilihan === true) jawabanTeks = "BENAR";
    else if (pilihan === false) jawabanTeks = "SALAH";

    riwayatJawaban.push({
        nomor: indexSoal,
        dijawab: pilihan,
        jawabanTeks: jawabanTeks
    });

    // Kirim ke Google Sheets
    kirimKeSheets({
        nama: namaSiswa,
        kelas: kelasSiswa,
        nomor_soal: indexSoal + 1,
        teks_soal: daftarSoal[indexSoal].teks,
        jawaban_siswa: jawabanTeks,
        waktu_jawab: new Date().toLocaleString("id-ID")
    });
}

/* ---------- KIRIM KE GOOGLE SHEETS ---------- */
function kirimKeSheets(data) {
    if (!URL_GOOGLE_SHEETS || URL_GOOGLE_SHEETS.includes("XXXXXXXXXXXXX")) {
        console.warn("⚠️ URL Google Sheets belum dikonfigurasi.");
        return;
    }

    const formData = new FormData();
    formData.append("data", JSON.stringify(data));

    const xhr = new XMLHttpRequest();
    xhr.open("POST", URL_GOOGLE_SHEETS, true);
    // JANGAN set Content-Type manual — biarkan browser atur untuk FormData
    xhr.onload = function() {
        console.log("✅ Response dari server:", xhr.responseText);
    };
    xhr.onerror = function() {
        console.error("❌ XHR error");
    };
    xhr.send(formData);
}

/* ---------- LANJUT OTOMATIS (waktu habis) ---------- */
function lanjutOtomatis() {
    document.getElementById("tombol-jawaban").style.display = "none";
    document.querySelectorAll(".tombol").forEach(b => b.disabled = true);
    if (nomor < daftarSoal.length - 1) {
        nomor++;
        tampilSoal();
    } else {
        setTimeout(tampilHasil, 500);
    }
}

function soalBerikutnya() {
    nomor++;
    tampilSoal();
}

/* ---------- HASIL AKHIR ---------- */
function tampilHasil() {
    clearInterval(timerInterval);
    document.getElementById("layar-soal").style.display = "none";
    document.getElementById("layar-akhir").style.display = "block";
    document.getElementById("status-kirim").textContent =
        "📤 Semua jawaban sudah dikirim ke Google Sheets.";
}

/* ---------- PEMBAHASAN ---------- */
function tampilkanPembahasan() {
    document.getElementById("layar-akhir").style.display = "none";
    document.getElementById("layar-pembahasan").style.display = "block";

    const wadah = document.getElementById("daftar-pembahasan");
    wadah.innerHTML = "";

    daftarSoal.forEach((soal, idx) => {
        const riwayat = riwayatJawaban[idx];
        const div = document.createElement("div");
        div.className = "item-soal";

        let statusJawaban = "";
        if (riwayat && riwayat.dijawab !== null && riwayat.dijawab !== undefined) {
            statusJawaban = `<span class="label-netral">📝 Jawabanmu: ${riwayat.jawabanTeks}</span>`;
        } else {
            statusJawaban = `<span class="label-salah">⏰ Tidak dijawab (waktu habis)</span>`;
        }

        div.innerHTML = `
            <strong>Soal ${idx + 1}:</strong> ${soal.teks}<br>
            ${statusJawaban}<br>
            Jawaban Benar: <strong>${soal.jawaban ? "BENAR" : "SALAH"}</strong><br>
            <em>${soal.penjelasan}</em>
        `;
        wadah.appendChild(div);
    });
}

/* ---------- MULAI ULANG ---------- */
function mulaiUlang() {
    nomor = 0;
    riwayatJawaban = [];
    namaSiswa = "";
    kelasSiswa = "";

    document.getElementById("layar-akhir").style.display = "none";
    document.getElementById("layar-pembahasan").style.display = "none";
    document.getElementById("layar-soal").style.display = "block";
    document.getElementById("info-siswa").style.display = "none";

    document.getElementById("form-identitas").style.display = "block";
    document.getElementById("pengaturan").style.display = "block";
    document.getElementById("tombol-mulai").style.display = "block";

    document.getElementById("input-nama").value = "";
    document.getElementById("input-kelas").value = "";
    document.getElementById("input-nama").focus();
}

ambilSoal();
</script>
</body>
</html>
