<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benar atau Salah? - Informatika</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            padding: 40px 35px;
            max-width: 700px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #2c3e50; margin-bottom: 15px; font-size: 2rem; line-height: 1.3; }
        .skor {
            background: #f0f9ff;
            padding: 18px;
            border-radius: 14px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #0066cc;
            font-size: 1.4rem;
        }
        .timer {
            background: #fff3cd;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #856404;
            font-size: 1.3rem;
        }
        .soal-box {
            background: #f8f9fa;
            padding: 35px 25px;
            border-radius: 18px;
            margin-bottom: 20px;
            border-left: 6px solid #4facfe;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            line-height: 1.7;
            color: #2c3e50;
        }
        .tombol-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .tombol {
            flex: 1;
            padding: 22px 15px;
            border: none;
            border-radius: 16px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .tombol:hover { transform: scale(1.05); }
        .tombol-benar { background: #2ecc71; color: white; }
        .tombol-salah { background: #e74c3c; color: white; }
        .feedback {
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 20px;
            display: none;
            text-align: left;
            line-height: 1.6;
            font-size: 1.1rem;
        }
        .feedback.benar { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .feedback.salah { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .lanjut-btn {
            background: #3498db;
            color: white;
            padding: 16px 35px;
            border: none;
            border-radius: 14px;
            font-size: 1.2rem;
            cursor: pointer;
            display: none;
            margin: 10px auto;
        }
        .lanjut-btn:hover { background: #2980b9; }
        .akhir, .pembahasan { display: none; }
        .progress { margin-bottom: 10px; color: #7f8c8d; font-size: 1.1rem; }
        .edit-info { background: #e3f2fd; padding: 14px; border-radius: 10px; margin-bottom: 20px; font-size: 0.95rem; color: #0c5460; }
        .daftar-soal { text-align: left; margin-top: 20px; }
        .item-soal { padding: 15px; border-bottom: 1px solid #eee; }
        .label-benar { color: #2ecc71; font-weight: bold; }
        .label-salah { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 Benar atau Salah?<br>Materi Informatika</h1>
        <div class="edit-info">💡 Edit soal di Google Sheet → ekspor CSV → tempel ke file `soal.csv` di GitHub untuk update</div>
        <div class="progress" id="progress">Soal 1 dari 0</div>
        <div class="skor">Skor: <span id="nilai">0</span></div>
        <div class="timer" id="timer">⏱️ Waktu: 20 detik</div>
        
        <div id="layar-soal">
            <div class="soal-box" id="teks-soal"></div>
            <div class="tombol-group">
                <button class="tombol tombol-benar" onclick="cekJawaban(true)">✅ BENAR</button>
                <button class="tombol tombol-salah" onclick="cekJawaban(false)">❌ SALAH</button>
            </div>
            <div class="feedback" id="feedback"></div>
            <button class="lanjut-btn" id="tombol-lanjut" onclick="soalBerikutnya()">Soal Berikutnya →</button>
        </div>

        <div class="akhir" id="layar-akhir">
            <h2 style="font-size: 1.8rem; margin-bottom: 15px;">🎉 Permainan Selesai!</h2>
            <p style="margin: 25px 0; font-size: 1.4rem;">Skor Akhir Kamu:</p>
            <p style="font-size: 3rem; font-weight: bold; color: #2c3e50;" id="skor-akhir">0/0</p>
            <p style="margin: 25px 0; font-size: 1.1rem;" id="pesan-akhir"></p>
            <button class="lanjut-btn" onclick="tampilkanPembahasan()">📖 Lihat Semua Jawaban</button>
            <button class="lanjut-btn" style="background:#2ecc71;" onclick="mulaiUlang()">🔄 Mulai Ulang</button>
        </div>

        <div class="pembahasan" id="layar-pembahasan">
            <h2 style="font-size: 1.8rem; margin-bottom: 20px;">📖 Pembahasan Lengkap</h2>
            <div class="daftar-soal" id="daftar-pembahasan"></div>
            <button class="lanjut-btn" style="margin-top:25px;" onclick="mulaiUlang()">🔄 Mulai Ulang</button>
        </div>
    </div>

<script>
let daftarSoal = [];
let nomor = 0, skor = 0, sudahDijawab = false;
let sisaWaktu = 20, timerInterval;
let riwayatJawaban = [];

async function ambilSoal() {
    try {
        const res = await fetch("soal.csv");
        if (!res.ok) throw new Error("Tidak ada file soal.csv");
        const teks = await res.text();
        const baris = teks.split("\n").map(r => {
            const hasil = [];
            let bagian = "", dalamKutip = false;
            for (let c of r) {
                if (c === '"') dalamKutip = !dalamKutip;
                else if (c === "," && !dalamKutip) { hasil.push(bagian.trim()); bagian = ""; }
                else bagian += c;
            }
            hasil.push(bagian.trim());
            return hasil;
        });
        
        daftarSoal = [];
        for (let i = 1; i < baris.length; i++) {
            const k = baris[i];
            if (!k || k.length < 3) continue;
            const teks = k[0].replace(/^"|"$/g, "");
            const jawab = k[1].toUpperCase().replace(/^"|"$/g, "") === "BENAR";
            const jelas = k[2].replace(/^"|"$/g, "") || (jawab ? "✅ Benar!" : "❌ Salah!");
            if (teks) daftarSoal.push({ teks, jawaban: jawab, penjelasan: jelas });
        }
    } catch {
        daftarSoal = [
            { teks: "CPU adalah otak dari komputer", jawaban: true, penjelasan: "✅ BENAR: CPU memproses semua perintah dan data." },
            { teks: "RAM menyimpan data permanen meski dimatikan", jawaban: false, penjelasan: "❌ SALAH: Data di RAM bersifat sementara dan hilang saat dimatikan." },
            { teks: "Algoritma adalah langkah logis untuk menyelesaikan masalah", jawaban: true, penjelasan: "✅ BENAR: Itulah definisi dasar algoritma." }
        ];
    }
    
    document.querySelector(".edit-info").style.display = daftarSoal.length > 3 ? "none" : "block";
    tampilSoal();
}

function tampilSoal() {
    sudahDijawab = false;
    sisaWaktu = 20;
    document.getElementById("progress").textContent = `Soal ${nomor+1} dari ${daftarSoal.length}`;
    document.getElementById("teks-soal").textContent = daftarSoal[nomor].teks;
    document.getElementById("feedback").style.display = "none";
    document.getElementById("tombol-lanjut").style.display = "none";
    document.querySelector(".tombol-group").style.display = "flex";
    document.getElementById("timer").textContent = `⏱️ Waktu: ${sisaWaktu} detik`;
    mulaiHitungMundur();
}

function mulaiHitungMundur() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        sisaWaktu--;
        document.getElementById("timer").textContent = `⏱️ Waktu: ${sisaWaktu} detik`;
        if (sisaWaktu <= 0) {
            clearInterval(timerInterval);
            if (!sudahDijawab) {
                riwayatJawaban.push({ nomor, dijawab: null, benar: false });
                tampilkanUmpanBalik("waktu");
            }
        }
    }, 1000);
}

function cekJawaban(pilihan) {
    if (sudahDijawab) return;
    sudahDijawab = true;
    clearInterval(timerInterval);
    
    const benar = pilihan === daftarSoal[nomor].jawaban;
    riwayatJawaban.push({ nomor, dijawab: pilihan, benar });
    
    if (benar) { skor++; document.getElementById("nilai").textContent = skor; }
    tampilkanUmpanBalik("pilihan", benar);
}

function tampilkanUmpanBalik(tipe, benar = false) {
    sudahDijawab = true;
    const fb = document.getElementById("feedback");
    
    if (tipe === "waktu") {
        fb.className = "feedback salah";
        fb.innerHTML = `⏱️ <b>Waktu habis!</b><br>Jawaban yang benar: <b>${daftarSoal[nomor].jawaban ? "BENAR" : "SALAH"}</b><br>${daftarSoal[nomor].penjelasan}`;
    } else {
        fb.className = "feedback " + (benar ? "benar" : "salah");
        fb.innerHTML = `${benar ? "✅" : "❌"} <b>${benar ? "Benar!" : "Kurang tepat"}</b><br>${daftarSoal[nomor].penjelasan}`;
    }
    
    fb.style.display = "block";
    document.querySelector(".tombol-group").style.display = "none";
    
    if (nomor < daftarSoal.length - 1) {
        document.getElementById("tombol-lanjut").style.display = "block";
    } else {
        setTimeout(tampilHasil, 1500);
    }
}

function soalBerikutnya() {
    nomor++;
    tampilSoal();
}

function tampilHasil() {
    clearInterval(timerInterval);
    document.getElementById("layar-soal").style.display = "none";
    document.getElementById("layar-akhir").style.display = "block";
    document.getElementById("skor-akhir").textContent = `${skor}/${daftarSoal.length}`;
    
    const p = skor / daftarSoal.length;
    document.getElementById("pesan-akhir").textContent = 
        p >= 0.9 ? "🌟 Luar biasa! Kamu sangat menguasai materi ini!" :
        p >= 0.7 ? "👍 Bagus! Tingkatkan lagi pemahamanmu!" :
        p >= 0.5 ? "💪 Cukup! Pelajari lagi bagian yang belum paham!" :
        "📚 Jangan menyerah, mari pelajari ulang materinya!";
}

function tampilkanPembahasan() {
    document.getElementById("layar-akhir").style.display = "none";
    document.getElementById("layar-pembahasan").style.display = "block";
    
    const wadah = document.getElementById("daftar-pembahasan");
    wadah.innerHTML = "";
    
    daftarSoal.forEach((soal, idx) => {
        const riwayat = riwayatJawaban[idx];
        const div = document.createElement("div");
        div.className = "item-soal";
        
        let statusJawaban = "";
        if (riwayat.dijawab === null) {
            statusJawaban = `<span class="label-salah">⏱️ Tidak dijawab / waktu habis</span>`;
        } else {
            statusJawaban = riwayat.benar 
                ? `<span class="label-benar">✅ Jawabanmu BENAR</span>`
                : `<span class="label-salah">❌ Jawabanmu SALAH</span>`;
        }
        
        div.innerHTML = `
            <strong>Soal ${idx+1}:</strong> ${soal.teks}<br>
            ${statusJawaban}<br>
            Jawaban Benar: <strong>${soal.jawaban ? "BENAR" : "SALAH"}</strong><br>
            <em>${soal.penjelasan}</em>
        `;
        wadah.appendChild(div);
    });
}

function mulaiUlang() {
    nomor = 0; skor = 0; riwayatJawaban = [];
    document.getElementById("nilai").textContent = "0";
    document.getElementById("layar-soal").style.display = "block";
    document.getElementById("layar-akhir").style.display = "none";
    document.getElementById("layar-pembahasan").style.display = "none";
    ambilSoal();
}

ambilSoal();
</script>
</body>
</html>
